[project]
name = "fci-pipeline"
version = "0.1.0"
description = "Supplier product data to FCI London import CSVs and web-ready images"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pillow>=10.4",
    "imagehash>=4.3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "composio>=0.30.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
fci = "fci.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the real supplier files in supplier_inputs/",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
