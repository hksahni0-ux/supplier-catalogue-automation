<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FCI Catalogue Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
/* Look: a furniture spec sheet. Warm stone paper, a faint architectural grid, ink type,
   terracotta for what matters, brass for totals. Measurements are drawn as dimension lines. */
:root {
  --stone: #ECE6DC; --stone-2: #E2DACD; --paper: #F7F3EC; --ink: #1F1D1A; --ink-2: #57524A;
  --mute: #8C857A; --terra: #A8482A; --terra-soft: #E7C9BC; --brass: #A9874E; --line: rgba(31,29,26,.12);
  --ok: #3F6B4E; --serif: "Fraunces", Georgia, serif; --sans: "Inter Tight", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stone); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 240px 240px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 240px 240px,
    linear-gradient(rgba(31,29,26,.035) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, rgba(31,29,26,.035) 1px, transparent 1px) 0 0 / 48px 48px,
    var(--stone); }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; opacity: 0; }

/* frame furniture */
#head { position: absolute; left: 96px; right: 96px; top: 44px; height: 40px; display: flex;
  justify-content: space-between; align-items: center; font: 500 17px/1 var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2); z-index: 5; }
#head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 1px; background: var(--ink); opacity: .55; }
#chapter b { color: var(--terra); font-weight: 700; margin-right: 14px; }
#progress { position: absolute; left: 96px; bottom: 40px; width: 1728px; height: 2px; background: var(--line); z-index: 5; }
#progress i { position: absolute; left: 0; top: 0; height: 2px; background: var(--terra); width: 0; }

#cap { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; z-index: 6;
  font: 500 34px/1.2 var(--sans); letter-spacing: -.005em; }
#cap span.line { display: inline-block; padding: 12px 26px 14px; background: rgba(247,243,236,.92);
  border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 8px 30px rgba(31,29,26,.08); }
#cap .w { transition: none; }

/* wipe between chapters: a terracotta sheet with the chapter title */
#wipe { position: absolute; inset: 0; background: var(--terra); z-index: 8; transform: translateX(-101%);
  display: flex; align-items: center; padding-left: 160px; color: var(--paper); }
#wipe .n { font: 500 22px/1 var(--mono); letter-spacing: .2em; margin-right: 40px; opacity: .8; }
#wipe .t { font: 300 84px/1 var(--serif); letter-spacing: -.02em; }

/* type */
.eyebrow { font: 500 18px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--terra); }
.display { font: 300 96px/1.02 var(--serif); letter-spacing: -.025em; }
.h2 { font: 400 54px/1.08 var(--serif); letter-spacing: -.02em; }
.big { font: 300 150px/0.95 var(--serif); letter-spacing: -.04em; font-variant-numeric: lining-nums tabular-nums; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 500 16px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.body { font: 400 26px/1.4 var(--sans); color: var(--ink-2); }

/* pieces */
.card { background: var(--paper); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(31,29,26,.10); }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--paper);
  border: 1px solid var(--line); font: 500 20px/1 var(--mono); color: var(--ink); white-space: nowrap; }
.chip.terra { background: var(--terra); color: var(--paper); border-color: var(--terra); }
.term { background: #1C1B19; color: #E8E2D6; font: 400 19px/1.5 var(--mono); padding: 22px 26px; white-space: pre;
  overflow: hidden; box-shadow: 0 24px 60px rgba(31,29,26,.25); }
.term .p { color: #D9A77F; }
.term .dim { color: #9A9184; }
.sheet { font: 400 17px/1 var(--mono); border-collapse: collapse; background: var(--paper); }
.sheet td, .sheet th { border: 1px solid #D8D0C2; padding: 9px 12px; white-space: nowrap; }
.sheet th { background: #E6DFD3; font-weight: 500; color: var(--ink-2); text-align: left; }
.dim-line { position: absolute; height: 1px; background: var(--ink); }
.dim-line::before, .dim-line::after { content: ""; position: absolute; top: -7px; width: 1px; height: 15px; background: var(--ink); }
.dim-line::before { left: 0; } .dim-line::after { right: 0; }
.dim-text { position: absolute; font: 500 15px/1 var(--mono); color: var(--ink-2); letter-spacing: .06em; }
.tick { color: var(--ok); font-weight: 700; }
.box { position: absolute; border: 2px solid var(--terra); background: rgba(168,72,42,.10); }
.sw { position: absolute; width: 74px; height: 74px; background-size: cover; background-position: center;
  border: 1px solid rgba(31,29,26,.18); }
.sw.missing { background: repeating-linear-gradient(45deg, transparent 0 7px, rgba(168,72,42,.18) 7px 8px);
  border: 1.5px dashed var(--terra); }
.stamp { position: absolute; font: 700 26px/1 var(--mono); letter-spacing: .14em; color: var(--terra);
  border: 3px solid var(--terra); padding: 12px 18px; transform: rotate(-6deg); text-transform: uppercase; }
.rule { position: absolute; height: 2px; background: var(--brass); }
</style>
</head>
<body>
<div id="stage">
  <div id="head"><span>FCI London · Supplier catalogue automation</span><span id="chapter"></span></div>
  <div id="progress"><i></i></div>
  <div id="cap"></div>
  <div id="wipe"><span class="n"></span><span class="t"></span></div>
</div>
<script>
// ---- engine: everything is a pure function of time, so every frame renders the same way twice
const D = window.DATA, TM = window.TIMING;
const S = Object.fromEntries(TM.scenes.map(s => [s.id, s]));
const W = TM.words;
const stage = document.getElementById("stage");
const anims = [], tickers = [], SFX = [];
const EASE = "cubic-bezier(.2,.75,.15,1)";

function el(tag, cls, html, parent = stage, style = {}) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  Object.assign(e.style, style);
  parent.appendChild(e);
  return e;
}
function px(o) { const s = {}; for (const k in o) s[k] = typeof o[k] === "number" ? o[k] + "px" : o[k]; return s; }
// A second animation of the same property must use fill "forwards", or its first keyframe would
// apply from time zero and hide the earlier one.
function at(e, kf, t, dur = .7, easing = EASE, fill = "both") {
  const a = e.animate(kf, { delay: t * 1000, duration: dur * 1000, fill, easing });
  a.pause(); anims.push(a); return a;
}
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
function cue(scene, word, nth = 0) {
  let k = 0;
  for (const w of W) if (w.scene === scene && norm(w.text).startsWith(norm(word))) { if (k++ === nth) return w.t; }
  console.warn("missing cue", scene, word, nth); return S[scene].start;
}
const fadeUp = (e, t, d = .7, y = 26) => at(e, [{ opacity: 0, transform: `translateY(${y}px)` }, { opacity: 1, transform: "none" }], t, d);
const fadeIn = (e, t, d = .5) => at(e, [{ opacity: 0 }, { opacity: 1 }], t, d, "linear");
const pop = (e, t, d = .5) => at(e, [{ opacity: 0, transform: "scale(.86)" }, { opacity: 1, transform: "scale(1)" }], t, d, "cubic-bezier(.3,1.5,.5,1)");
const grow = (e, t, d = .8, w) => at(e, [{ width: "0px" }, { width: w + "px" }], t, d);
const fmt = n => Math.round(n).toLocaleString("en-GB");
function counter(e, t0, d, from, to, f = fmt, sound = true) {
  tickers.push(t => { const p = Math.min(1, Math.max(0, (t - t0) / d)); const q = 1 - Math.pow(1 - p, 3); e.textContent = f(from + (to - from) * q); });
  if (sound) SFX.push({ t: t0 + d, kind: "land" });
}
function typer(e, text, t0, cps = 40) {
  tickers.push(t => { const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) * cps))); e.textContent = text.slice(0, n); });
  return t0 + text.length / cps;
}
function scene(id, chapter) {
  const s = S[id], root = el("div", "scene", null);
  root.dataset.id = id;
  const ids = TM.scenes.map(x => x.id), i = ids.indexOf(id);
  at(root, [{ opacity: 0 }, { opacity: 1 }], Math.max(0, s.start - .05), .25, "linear");
  if (i < ids.length - 1) at(root, [{ opacity: 1 }, { opacity: 0 }], s.end - .05, .25, "linear", "forwards");
  if (chapter) tickers.push(t => { if (t >= s.start - .1 && t < s.end) chapterEl.innerHTML = chapter; });
  return root;
}
const chapterEl = document.getElementById("chapter");

// ---- chapter wipes: only where the story moves on to a new part
const WIPES = [["run", "01", "The run"], ["richard", "02", "Richard Double Bed"], ["burt", "03", "Burt Corner Sofa"],
  ["images", "04", "Images"], ["thomas", "05", "Proof"], ["drive", "06", "The workspace"],
  ["assistant", "07", "The assistant"], ["close", "08", "Result"]];
const wipe = document.getElementById("wipe");
const inout = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
tickers.push(t => {
  let x = -101;
  for (const [id, n, title] of WIPES) {
    const b = S[id].start, a0 = b - .42, a1 = b - .08, b0 = b + .18, b1 = b + .56;
    if (t < a0 || t > b1) continue;
    wipe.querySelector(".n").textContent = n; wipe.querySelector(".t").textContent = title;
    x = t < a1 ? -101 + 101 * inout((t - a0) / (a1 - a0)) : t < b0 ? 0 : 101 * inout((t - b0) / (b1 - b0));
  }
  wipe.style.transform = `translateX(${x}%)`;
});
for (const [id] of WIPES) SFX.push({ t: S[id].start - .42, kind: "wipe" });

// ---- captions: short phrases, each word lights up as it is spoken
const lines = []; { let cur = [];
  for (const w of W) { cur.push(w); if (cur.length >= 7 || /[.,:;?!]$/.test(w.raw)) { lines.push(cur); cur = []; } }
  if (cur.length) lines.push(cur); }
const cap = document.getElementById("cap"); let shown = -1;
tickers.push(t => {
  let k = lines.findIndex(l => t >= l[0].t - .05 && t <= l[l.length - 1].t + l[l.length - 1].d + .35);
  if (S.creator && t >= S.creator.start) k = -1;
  if (k !== shown) { shown = k; cap.innerHTML = k < 0 ? "" : `<span class="line">${lines[k].map((w, j) => `<span class="w" data-j="${j}">${w.raw}</span>`).join(" ")}</span>`; }
  if (k >= 0) cap.querySelectorAll(".w").forEach((s, j) => { s.style.opacity = t >= lines[k][j].t - .02 ? 1 : .32; });
});
const prog = document.querySelector("#progress i");
tickers.push(t => { prog.style.width = (1728 * Math.min(1, t / TM.total)) + "px"; });

// ======================================================================= scenes
const P = D.products;
const euro = n => "€" + fmt(n), pound = n => "£" + fmt(n);

// 0 hook ---------------------------------------------------------------
{ const r = scene("hook", "<b>00</b>Overview");
  const s = S.hook;
  const eb = el("div", "eyebrow abs", "Round 2 · technical assessment", r, px({ left: 120, top: 150 }));
  const ti = el("div", "display abs", "Supplier files in.<br>FCI upload sheets out.", r, px({ left: 116, top: 190, width: 1100 }));
  fadeUp(eb, s.start + .1); fadeUp(ti, s.start + .25, .9);
  const items = [["burt", "Burt Corner Sofa", "Franco Ferri · GBP"], ["richard", "Richard Double Bed", "Cattelan Italia · EUR"], ["thomas", "Thomas Double Bed", "Cattelan Italia · EUR"]];
  const t3 = cue("hook", "3");
  items.forEach(([k, name, src], i) => {
    const x = 120 + i * 470, c = el("div", "card abs", null, r, px({ left: x, top: 430, width: 440, height: 330 }));
    const img = k === "burt" ? D.images.burt[0] : D.images[k][0];
    el("div", "abs", null, c, px({ left: 0, top: 0, width: 440, height: 250, background: `#fff url(${"assets/" + img}) center/cover` }));
    el("div", "abs", `<div style="font:500 23px/1.2 var(--sans)">${name}</div><div class="label" style="margin-top:6px">${src} · from ${k === "burt" ? pound(P[k].base_price) : euro(P[k].base_price)}</div>`, c, px({ left: 20, top: 266 }));
    fadeUp(c, t3 + i * .18, .7, 40);
  });
  const files = ["product-upload", "categories", "images", "attributes", "prices", "details"];
  const t6 = cue("hook", "6");
  const fileX = 1550;
  files.forEach((f, i) => { const c = el("div", "chip abs", `<span style="color:var(--terra)">csv</span>${f}`, r, px({ left: fileX, top: 430 + i * 56, height: 46, fontSize: 18 })); fadeUp(c, t6 + i * .09, .45, 14); SFX.push({ t: t6 + i * .09, kind: "tick", v: .5 }); });
  const cmd = el("div", "chip terra abs", "$ uv run fci run jobs/", r, px({ left: 1240, top: 250, fontSize: 24, padding: "16px 22px" }));
  pop(cmd, cue("hook", "1")); SFX.push({ t: cue("hook", "1"), kind: "land" });
  const by = el("div", "label abs", "Prateek Sahni · for FCI London", r, px({ left: 120, top: 800, color: "var(--ink-2)" }));
  fadeIn(by, cue("hook", "fci"));
}

// 1 pain ---------------------------------------------------------------
{ const r = scene("pain", "<b>00</b>Today, by hand");
  const s = S.pain, aspect = D.page.aspect, H = 640, Wd = H * aspect;
  const pg = el("div", "card abs", null, r, px({ left: 120, top: 150, width: Wd, height: H, background: `#fff url(assets/p358.png) center/cover` }));
  fadeUp(pg, s.start + .05);
  const pn = el("div", "abs num", "", r, px({ left: 120, top: 815, fontSize: 30, color: "var(--ink)" }));
  const tp = cue("pain", "373");
  tickers.push(t => { const p = Math.min(1, Math.max(0, (t - tp) / 1.8)); const n = Math.max(1, Math.round(1 + 357 * (1 - Math.pow(1 - p, 2)))); pn.innerHTML = `p. ${n} <span style="color:var(--mute)">of ${D.page.page_count}</span>`; });
  fadeIn(pn, s.start + .2);
  // the sheet being typed by hand
  const sx = 120 + Wd + 70, sheet = el("table", "sheet abs", null, r, px({ left: sx, top: 150 }));
  sheet.innerHTML = `<tr><th>code</th><th>combo</th><th>price</th></tr>`;
  const tt = cue("pain", "typing"), rowsShown = 12;
  D.price_rows.slice(0, rowsShown).forEach((row, i) => {
    const tr = el("tr", null, `<td>${row.code}</td><td>${row.combo}</td><td>${row.price}</td>`, sheet);
    at(tr, [{ opacity: 0 }, { opacity: 1 }], tt + .15 + i * .32, .12, "linear");
  });
  const cnt = el("div", "big abs", "0", r, px({ left: sx, top: 720, fontSize: 120 }));
  el("div", "label abs", "price rows · Richard alone", r, px({ left: sx + 6, top: 850 }));
  counter(cnt, cue("pain", "2340"), 1.9, 0, P.richard.combinations);
  fadeIn(cnt, tt - .2);
  const st = el("div", "stamp", "by hand", r, px({ left: sx + 760, top: 735 }));
  pop(st, cue("pain", "by")); SFX.push({ t: cue("pain", "by"), kind: "stamp" });
}

// 2 run ----------------------------------------------------------------
{ const r = scene("run", "<b>01</b>The run");
  const files = [["PDF", "CATTELAN ITALIA p.list 05-26 EUR", `${D.page.page_count} pages · prices, sizes, drawings`, "cattelan"],
    ["XLSM", "Franco Ferri GBP Price List · June 2026", `row ${D.burt_modules.at(-1).source_row} · BERTE' FF modules`, "franco"],
    ["XLS", "Franco Ferri swatch card 2025", "fabrics · leathers · feet · stitching", "swatch"]];
  files.forEach(([ext, name, meta, word], i) => {
    const c = el("div", "card abs", `<div class="abs num" style="left:0;top:0;width:96px;height:118px;background:${i ? "var(--brass)" : "var(--terra)"};color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">${ext}</div>
      <div class="abs" style="left:120px;top:24px;font:500 22px/1.25 var(--sans);width:420px">${name}</div><div class="abs label" style="left:120px;top:84px">${meta}</div>`, r, px({ left: 120, top: 160 + i * 150, width: 560, height: 118 }));
    fadeUp(c, cue("run", word), .6, 30); SFX.push({ t: cue("run", word), kind: "tick", v: .6 });
  });
  const job = D.job.split("\n").filter(l => l && !l.startsWith("#")).map(l => l.replace(/\s+#.*$/, "").replace(/"(https?:\/\/[^"]{24})[^"]*"/, '"$1…"')).join("\n");
  const jc = el("div", "card abs", `<div class="label" style="margin-bottom:14px">jobs/richard-double-bed.yaml</div><pre class="num" style="font-size:17px;line-height:1.55;color:var(--ink);white-space:pre-wrap"></pre>`, r, px({ left: 730, top: 160, width: 520, height: 420, padding: "24px 26px" }));
  const tj = cue("run", "job");
  fadeUp(jc, tj - .3); typer(jc.querySelector("pre"), job, tj, 70);
  const term = el("div", "term abs", "", r, px({ left: 1290, top: 160, width: 530, height: 560, fontSize: 15, whiteSpace: "pre-wrap" }));
  const tr = cue("run", "command") - 1.2;
  fadeUp(term, tr - .5);
  const lines = D.run.trim().split("\n").filter(l => !l.includes("output:"));
  const cmd = "$ uv run fci run jobs/";
  tickers.push(t => {
    const typed = Math.max(0, Math.min(cmd.length, Math.floor((t - tr) * 40)));
    const after = t - (tr + cmd.length / 40 + .15);
    const n = after < 0 ? 0 : Math.min(lines.length, Math.floor(after / .07) + 1);
    const body = lines.slice(0, n).map(l => l.replace(/^== (.*)$/, '<span class="p">== $1</span>').replace(/(0 errors)/, '<span style="color:#9BC2A3">$1</span>')).join("\n");
    term.innerHTML = `<span class="p">${cmd.slice(0, typed)}</span>\n${body.replace(/\n   /g, "\n ")}`;
  });
  SFX.push({ t: tr + cmd.length / 40 + .15, kind: "tick", v: .7 });
}

// 3 richard ------------------------------------------------------------
{ const r = scene("richard", "<b>02</b>Richard Double Bed · Cattelan Italia");
  const H = 800, Wd = H * D.page.aspect;
  const pg = el("div", "card abs", null, r, px({ left: 120, top: 140, width: Wd, height: H, background: "#fff url(assets/p358.png) center/cover" }));
  fadeUp(pg, S.richard.start + .1);
  const t70 = cue("richard", "70");
  D.page.cells.forEach((c, i) => {
    const b = el("div", "box", null, pg, px({ left: c.x * Wd - 3, top: c.y * H - 2, width: c.w * Wd + 6, height: c.h * H + 4 }));
    fadeIn(b, t70 + i * .022, .15);
  });
  SFX.push({ t: t70, kind: "sweep" });
  const x0 = 120 + Wd + 80;
  const n70 = el("div", "big abs", "0", r, px({ left: x0, top: 140 }));
  el("div", "label abs", `prices on p.358`, r, px({ left: x0 + 8, top: 290 }));
  counter(n70, t70, 1.5, 0, 70); fadeIn(n70, t70 - .1, .2);
  [["5 sizes", "5"], ["10 cover columns", "10"], ["+ pull-up storage version", "storage"]].forEach(([txt, w], i) => {
    const c = el("div", "chip abs", txt, r, px({ left: x0 + [0, 150, 410][i], top: 330 })); fadeUp(c, cue("richard", w), .45, 12);
  });
  // colours from the online finishes catalogue
  const tc = cue("richard", "cattelan");
  const head = el("div", "abs", `<div class="eyebrow">Cattelan finishes catalogue · online</div>`, r, px({ left: x0, top: 420 }));
  fadeUp(head, tc);
  D.swatches.ecp.forEach((src, i) => {
    const s = el("div", "sw", null, r, px({ left: x0 + (i % 9) * 82, top: 462 + Math.floor(i / 9) * 82, backgroundImage: `url(assets/${src})` }));
    pop(s, tc + .25 + i * .05, .4);
  });
  const n356 = el("div", "abs", `<span class="num" style="font-size:44px;font-weight:500">${P.richard.swatches.downloaded}</span><span class="label" style="margin-left:18px">colours behind the columns · e.g. ${D.swatches.ecp.length} synthetic leathers</span>`, r, px({ left: x0, top: 640 }));
  fadeUp(n356, cue("richard", "356"));
  // 70 -> 2,340
  const ts = cue("richard", "so");
  const eq = el("div", "abs", `<span class="num" style="font-size:34px">70 prices × colours per group =</span>`, r, px({ left: x0, top: 730 }));
  fadeUp(eq, ts);
  const rowsN = el("div", "big abs", "70", r, px({ left: x0, top: 776, fontSize: 120, color: "var(--terra)" }));
  fadeIn(rowsN, ts, .3); counter(rowsN, cue("richard", "2340"), 1.6, 70, P.richard.combinations);
  const lab = el("div", "label abs", `rows · ${euro(P.richard.price_range[0])} to ${euro(P.richard.price_range[1])} · copied exactly`, r, px({ left: x0 + 6, top: 912 - 20, display: "none" }));
  const lab2 = el("div", "label abs", `rows<br>${euro(P.richard.price_range[0])} to ${euro(P.richard.price_range[1])}<br>copied exactly`, r, px({ left: x0 + 400, top: 810, lineHeight: "1.7" }));
  fadeUp(lab2, cue("richard", "copied"));
  fadeUp(lab, cue("richard", "copied"));

  const f = el("div", "abs", `<div style="height:38px;background:#E2DACD;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)"><i style="width:12px;height:12px;border-radius:50%;background:#D9A77F"></i><i style="width:12px;height:12px;border-radius:50%;background:#C9BBA4"></i><i style="width:12px;height:12px;border-radius:50%;background:#C9BBA4"></i><span class="num" style="margin-left:18px;font-size:14px;color:var(--ink-2)">FCI Catalogue · catalogue assistant (React)</span></div>`, r, px({ ...place, background: "var(--paper)", boxShadow: "0 30px 80px rgba(31,29,26,.22)", border: "1px solid var(--line)", overflow: "hidden" }));
  const view = el("div", "abs", null, f, px({ left: 0, top: 38, width: place.width, height: place.height - 38, overflow: "hidden" }));
  const zoom = el("div", "abs", null, view, px({ inset: 0 }));  // scaled inside the clipped view
  const imgs = shots.map(name => el("div", "abs", null, zoom, px({ inset: 0, background: `url(assets/app/${name}.png) top left/100% auto no-repeat`, opacity: 0 })));
  return { frame: f, view: zoom, imgs };
}

// ---- public API for the renderer
window.SFX = SFX.sort((a, b) => a.t - b.t);
window.seek = t => { for (const a of anims) a.currentTime = t * 1000; for (const f of tickers) f(t); };
window.seek(0);
window.READY = document.fonts.ready.then(() => Promise.all([...document.querySelectorAll("*")].flatMap(e => {
  const m = getComputedStyle(e).backgroundImage.match(/url\("?([^")]+)"?\)/g) || [];
  return m.map(u => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = u.slice(4, -1).replace(/"/g, ""); }));
})));
